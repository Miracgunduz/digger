name: Gunluk Firsat Bulteni

on:
  schedule:
    # Turkiye (UTC+3, DST yok) saatiyle 09:00 ve 21:00
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # son_calisma.txt commit'i icin gerekli

concurrency:
  group: firsat-avcisi-daily
  cancel-in-progress: false

jobs:
  run-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Taramayi calistir ve Telegram'a gonder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python notify.py

      - name: Repo'yu aktif tut (GitHub, 60 gun hareketsiz repolarda schedule'i otomatik kapatiyor)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          date -u +%Y-%m-%dT%H:%M:%SZ > data/son_calisma.txt
          git add data/son_calisma.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: son calisma $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2; do
            git push && exit 0
            git pull --rebase origin master
          done
          git push
