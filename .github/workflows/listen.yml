name: Komut Dinleyici

on:
  schedule:
    # GitHub'in izin verdigi en kisa aralik 5 dakika (garanti degil, gecikebilir)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: firsat-avcisi-listen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-listen:
    runs-on: ubuntu-latest
    # /tara ve /trendler Reddit RSS hiz siniri yuzunden ~15-20 dk surebiliyor
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Bekleyen komutlari isle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python listen.py

      - name: Telegram offset'ini commit'le (degistiyse)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state/last_update_id.txt; then
            git add state/last_update_id.txt
            git commit -m "chore: update Telegram offset [skip ci]"
            git push
          else
            echo "Offset degismedi, commit atlaniyor."
          fi
